<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFE9F1" id="themeColorMeta">
<title>Nugas Mahasigma — Paan & Mya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<style>
:root{
  --radius-lg:26px; --radius-md:16px; --radius-sm:12px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Fraunces',Georgia,serif;
}
body[data-mode="myla"]{
  --ink:#3E1F2E; --ink-soft:#7A5064; --ink-faint:#BC93A6;
  --accent:#E8558A; --accent-deep:#C43E70; --accent-soft:#FFB6CE;
  --on-accent:#FFFFFF;
  --card:rgba(255,255,255,.72); --card-hover:rgba(255,255,255,.94);
  --track:rgba(255,255,255,.5);
  --panel-border:rgba(255,255,255,.75);
  --line:rgba(62,31,46,.10);
  --shadow:rgba(196,62,112,.22);
  --font-display:'Fraunces',Georgia,serif;
  --focus-ring:rgba(232,85,138,.16);
}
body[data-mode="paanz"]{
  --ink:#ECEEF6; --ink-soft:#9BA2B8; --ink-faint:#6A7188;
  --accent:#8B98FF; --accent-deep:#5A69E8; --accent-soft:#2B3157;
  --on-accent:#FFFFFF;
  --card:rgba(255,255,255,.05); --card-hover:rgba(255,255,255,.10);
  --track:rgba(255,255,255,.05);
  --panel-border:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.09);
  --shadow:rgba(0,0,0,.55);
  --font-display:'Space Grotesk','Manrope',sans-serif;
  --focus-ring:rgba(139,152,255,.20);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  font-family:var(--font-body); color:var(--ink);
  background:#0C0C12; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:color .55s var(--ease);
}
.bg-layer{position:fixed; inset:0; z-index:0; pointer-events:none; transition:opacity .8s var(--ease);}
.bg-layer--myla{
  background:
    radial-gradient(760px 520px at 88% -12%, rgba(255,178,212,.70), transparent 66%),
    radial-gradient(680px 540px at 2% 106%, rgba(240,140,190,.45), transparent 66%),
    linear-gradient(160deg,#FFF7FA 0%,#FFE9F1 45%,#FFD8E8 100%);
  opacity:1;
}
.bg-layer--paanz{
  background:
    radial-gradient(760px 520px at 88% -12%, rgba(96,110,200,.30), transparent 66%),
    radial-gradient(680px 540px at 2% 106%, rgba(58,68,148,.26), transparent 66%),
    linear-gradient(160deg,#07070C 0%,#0D0D15 45%,#14141F 100%);
  opacity:0;
}
body[data-mode="paanz"] .bg-layer--myla{opacity:0;}
body[data-mode="paanz"] .bg-layer--paanz{opacity:1;}
::selection{background:var(--accent-soft);color:var(--ink);}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
.page{
  position:relative; z-index:1; width:100%; max-width:760px;
  margin:0 auto;
  padding:clamp(22px,5.5vw,52px) clamp(14px,4vw,24px) calc(72px + env(safe-area-inset-bottom));
}
.hero{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:clamp(18px,4vw,28px);}

h1{
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(1.85rem,7vw,3rem); line-height:1.05;
  letter-spacing:-.015em; margin:6px 0 0; color:var(--ink);
  transition:color .5s var(--ease);
}
body[data-mode="paanz"] h1{
  background:linear-gradient(180deg,#FFFFFF 0%,#DCE0EC 38%,#98A0B6 70%,#666D86 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  letter-spacing:-.025em;
}
.hero-sub{
  font-size:clamp(.9rem,2.6vw,.99rem); color:var(--ink-soft);
  max-width:46ch; margin:12px 0 0; line-height:1.6;
  min-height:1.7em; transition:color .5s var(--ease);
}
.motivation-text{display:inline-block; opacity:1; transform:translateY(0); transition:opacity .55s var(--ease), transform .55s var(--ease);}
.motivation-text.fading{opacity:0; transform:translateY(6px);}

.tab-switch{
  --tab-pad:5px;
  position:relative; display:inline-flex; align-items:center;
  background:var(--track); border-radius:999px; padding:var(--tab-pad);
  margin:clamp(16px,4vw,22px) 0 0; flex-shrink:1; min-width:0;
  box-shadow:inset 0 0 0 1.5px var(--panel-border), 0 14px 34px -18px var(--shadow);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:background .55s var(--ease), box-shadow .55s var(--ease);
}
.tab-switch.bump{ animation:tab-bump .65s var(--ease); }
@keyframes tab-bump{
  0%,100% { transform:scale(1); }
  35%     { transform:scale(1.05); }
  65%     { transform:scale(.98); }
}
.tab-thumb{
  position:absolute; top:var(--tab-pad); left:var(--tab-pad);
  height:calc(100% - var(--tab-pad) * 2); width:0;
  border-radius:999px;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  box-shadow:0 8px 20px -8px var(--accent-deep);
  transition:transform .48s var(--ease), width .48s var(--ease), background .55s var(--ease);
  z-index:0;
}
.tab-btn{
  position:relative; z-index:1; border:none; background:transparent;
  font-weight:700; font-size:clamp(.78rem,2.4vw,.9rem); color:var(--ink-soft);
  padding:10px clamp(11px,3.6vw,22px); border-radius:999px; cursor:pointer;
  display:flex; align-items:center; gap:7px; white-space:nowrap;
  transition:color .35s ease; -webkit-tap-highlight-color:transparent;
}
.tab-btn.active{color:var(--on-accent);}
.tab-dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex-shrink:0;}
.tab-count{font-size:.74rem; font-weight:800; opacity:.8;}

.board{
  position:relative; overflow:hidden; border-radius:var(--radius-lg);
  box-shadow:0 22px 60px -24px var(--shadow), 0 2px 10px rgba(0,0,0,.06);
  transition:box-shadow .55s var(--ease);
}
.board-track{display:flex; width:200%; transition:transform .55s var(--ease); will-change:transform;}
.board[data-active="myla"] .board-track{transform:translateX(-50%);}
.panel{
  width:50%; flex-shrink:0;
  padding:clamp(18px,4.5vw,28px) clamp(14px,4vw,26px) clamp(20px,4vw,26px);
  position:relative; overflow:hidden; display:flex; flex-direction:column; min-height:440px;
}
.panel.paan{
  --ink:#ECEEF6; --ink-soft:#9BA2B8; --ink-faint:#6A7188;
  --accent:#8B98FF; --accent-deep:#5A69E8; --accent-soft:#2B3157;
  --on-accent:#FFFFFF;
  --card:rgba(255,255,255,.05); --card-hover:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.09);
  --panel-border:rgba(255,255,255,.08);
  --focus-ring:rgba(139,152,255,.20);
  --font-display:'Space Grotesk','Manrope',sans-serif;
  background:linear-gradient(150deg,#17171F 0%,#101018 55%,#1C1C2A 100%);
  color:var(--ink);
}
.panel.myla{
  --ink:#3E1F2E; --ink-soft:#7A5064; --ink-faint:#BC93A6;
  --accent:#E8558A; --accent-deep:#C43E70; --accent-soft:#FFB6CE;
  --on-accent:#FFFFFF;
  --card:rgba(255,255,255,.72); --card-hover:rgba(255,255,255,.94);
  --line:rgba(62,31,46,.10);
  --panel-border:rgba(255,255,255,.75);
  --focus-ring:rgba(232,85,138,.16);
  --font-display:'Fraunces',Georgia,serif;
  background:linear-gradient(150deg,#FFEFF5 0%,#FFE3ED 55%,#FFC9DF 100%);
  color:var(--ink);
}
.panel-glow{position:absolute; width:240px; height:240px; border-radius:50%; top:-90px; right:-70px; pointer-events:none;}
.panel.paan .panel-glow{background:radial-gradient(circle, rgba(139,152,255,.18) 0%, transparent 70%);}
.panel.myla .panel-glow{background:radial-gradient(circle, rgba(255,255,255,.8) 0%, transparent 72%);}
.panel-header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:10px; position:relative; z-index:1;
}
.owner-block{display:flex; align-items:center; gap:12px; min-width:0;}
.owner-name{
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(1.3rem,4.4vw,1.55rem); margin:0; line-height:1.1; color:var(--ink);
}
.panel.paan .owner-name{
  background:linear-gradient(180deg,#FFFFFF 0%,#D8DCEA 38%,#9AA2B8 70%,#69708A 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  letter-spacing:-.02em;
}
.owner-meta{
  font-size:.8rem; color:var(--ink-soft); margin:3px 0 0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.panel-play-scene{
  display:flex; align-items:center; justify-content:center;
  gap:clamp(4px,1.6vw,12px);
  margin:6px 0 clamp(10px,3vw,16px);
  padding:clamp(6px,2vw,10px) 0;
  position:relative; z-index:1;
}
.cat-stage{
  position:relative; flex-shrink:0;
  width:clamp(52px,13vw,76px); aspect-ratio:140/120; margin:0;
}
.cat-float{position:absolute; inset:0; animation:cat-play 4.2s ease-in-out infinite;}
.cat{position:absolute; inset:0; width:100%; height:100%; opacity:0; transition:opacity .65s var(--ease); overflow:visible;}
body[data-mode="myla"] .cat--white{opacity:1;}
body[data-mode="paanz"] .cat--black{opacity:1;}
.cat--white{--cat-fill:#FFFFFF; --cat-line:#E2A9C6; --cat-eye:#3E1F2E; --cat-nose:#FF9EC0; --cat-blush:#FFB6CE;}
.cat--black{--cat-fill:#20202E; --cat-line:rgba(168,182,255,.55); --cat-eye:#DCE3FF; --cat-nose:#C96E93; --cat-blush:#8B98FF; filter:drop-shadow(0 0 16px rgba(120,140,255,.30));}
.cat__body,.cat__face,.cat__ear{fill:var(--cat-fill); stroke:var(--cat-line); stroke-width:2; stroke-linejoin:round;}
.cat__tail{fill:none; stroke:var(--cat-fill); stroke-width:11; stroke-linecap:round;}
.cat__paw{fill:var(--cat-fill); stroke:var(--cat-line); stroke-width:2;}
.cat__eye{fill:var(--cat-eye);}
.cat__nose{fill:var(--cat-nose);}
.cat__blush{fill:var(--cat-blush); opacity:.5;}
.cat__mouth,.cat__whiskers path{fill:none; stroke:var(--cat-line); stroke-width:1.7; stroke-linecap:round;}
.cat__eye-line{fill:none; stroke:var(--cat-eye); stroke-width:2.6; stroke-linecap:round;}
.cat__tail{transform-box:fill-box; transform-origin:0% 100%; animation:cat-tail 2.9s ease-in-out infinite;}
.cat__body{transform-box:fill-box; transform-origin:center bottom; animation:cat-breathe 3.6s ease-in-out infinite;}
.cat__head{transform-box:fill-box; transform-origin:center bottom; animation:cat-head 3.6s ease-in-out infinite;}
.cat__eyes{transform-box:fill-box; transform-origin:center; animation:cat-blink 5.2s ease-in-out infinite;}
@keyframes cat-tail{0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-13deg);}}
@keyframes cat-breathe{0%,100%{transform:scale(1,1);} 50%{transform:scale(1.022,1.038);}}
@keyframes cat-head{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-1.8px) rotate(-1.3deg);}}
@keyframes cat-blink{0%,90%,100%{transform:scaleY(1);} 94%{transform:scaleY(.12);} 97%{transform:scaleY(1);}}

@keyframes cat-play{
  0%, 100% { transform:translate(0,0) rotate(0deg); }
  12%      { transform:translate(1px,-2px) rotate(-1deg); }
  24%      { transform:translate(5px,-4px) rotate(6deg); }
  36%      { transform:translate(-1px,-3px) rotate(-3deg); }
  48%      { transform:translate(3px,-6px) rotate(4deg); }
  60%      { transform:translate(0,-2px) rotate(0deg); }
  72%      { transform:translate(2px,-3px) rotate(2deg); }
  86%      { transform:translate(0,0) rotate(0deg); }
}
.cat-float.jump { animation: cat-jump 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
@keyframes cat-jump {
  0%, 100% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-25px) scale(1.1); }
  50% { transform: translateY(0) scale(0.95); }
  70% { transform: translateY(-10px) scale(1.05); }
}

.cat-stage .cat__eyes--happy,
.cat-stage .cat__eyes--sleep,
.cat-stage .cat__eyes--angry { display: none; }

.cat-stage.mood-happy .cat__eyes--open,
.cat-stage.mood-sleeping .cat__eyes--open,
.cat-stage.mood-angry .cat__eyes--open { display: none; }
.cat-stage.mood-happy .cat__eyes--happy { display: block; }
.cat-stage.mood-sleeping .cat__eyes--sleep { display: block; }
.cat-stage.mood-angry .cat__eyes--angry { display: block; }

.cat-zzz{
  position:absolute; top:-2px; right:-2px;
  font-family:var(--font-display); font-weight:700; font-style:italic;
  font-size:.85rem; line-height:1;
  color:var(--accent); opacity:0; pointer-events:none;
  text-shadow:0 2px 8px var(--shadow);
}
.cat-stage.mood-sleeping .cat-zzz{
  animation:zzz-float 3.2s ease-in-out infinite;
}
@keyframes zzz-float{
  0%   { opacity:0; transform:translate(0,0) scale(.6); }
  20%  { opacity:1; transform:translate(-2px,-4px) scale(.9); }
  60%  { opacity:.75; transform:translate(-6px,-13px) scale(1.1); }
  100% { opacity:0; transform:translate(-11px,-22px) scale(1.35); }
}

.cat-stage.mood-sleeping .cat-float{ animation:cat-sleep 5.5s ease-in-out infinite; }
.cat-stage.mood-sleeping .cat__tail{ animation:cat-tail-sleep 5.5s ease-in-out infinite; }
.cat-stage.mood-sleeping .cat__head{ animation:none; }
.cat-stage.mood-sleeping .cat__eyes{ animation:none; }
.cat-stage.mood-sleeping .cat__body{ animation:cat-breathe-slow 5.5s ease-in-out infinite; }
@keyframes cat-sleep{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%    { transform:translateY(1.6px) rotate(-1deg); }
}
@keyframes cat-tail-sleep{
  0%,100%{ transform:rotate(0deg); }
  50%    { transform:rotate(-4deg); }
}
@keyframes cat-breathe-slow{
  0%,100%{ transform:scale(1,1); }
  50%    { transform:scale(1.028,1.05); }
}
.cat-stage.mood-angry .cat__tail{ animation-duration:1s; }
.cat-stage.mood-angry .cat__head{ animation:cat-head-angry .8s ease-in-out infinite; }
@keyframes cat-head-angry{
  0%,100%{ transform:translate(0,0) rotate(0deg); }
  25%    { transform:translate(-1px,0) rotate(-2.5deg); }
  75%    { transform:translate(1px,0) rotate(2.5deg); }
}
.cat-stage.mood-happy .cat-float{
  animation:cat-happy 1.3s cubic-bezier(.36,1.4,.4,1) infinite;
}
@keyframes cat-happy{
  0%,100%{ transform:translateY(0) scale(1); }
  30%    { transform:translateY(-9px) scale(1.06); }
  60%    { transform:translateY(0) scale(.96); }
  80%    { transform:translateY(-3px) scale(1.02); }
}
.cat-stage.mood-smile .cat__tail{ animation-duration:2s; }

.count-ball-scene{
  position:relative;
  width:clamp(46px,12vw,60px);
  height:clamp(56px,14vw,72px);
  display:flex; align-items:flex-end; justify-content:center;
  flex-shrink:0;
}
.count-ball{
  position:relative; z-index:1;
  width:clamp(44px,11.5vw,56px);
  height:clamp(44px,11.5vw,56px);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.05rem,4vw,1.4rem);
  color:var(--on-accent);
  letter-spacing:-.02em;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.75), rgba(255,255,255,.15) 42%, transparent 62%),
    linear-gradient(140deg, var(--accent), var(--accent-deep));
  box-shadow:
    0 8px 18px -8px var(--shadow),
    inset 0 -6px 12px rgba(0,0,0,.18),
    inset 0 4px 8px rgba(255,255,255,.35);
  animation:ball-play 4.2s ease-in-out infinite;
  will-change:transform;
  user-select:none;
}
.count-ball-shadow{
  position:absolute;
  bottom:0; left:50%;
  width:74%; height:7px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse at center, var(--shadow), transparent 72%);
  animation:ball-shadow 4.2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes ball-play{
  0%, 100% { transform:translate(0,0) scale(1); }
  12%      { transform:translate(-2px,-5px) scale(1.04); }
  24%      { transform:translate(6px,-9px) scale(1.06); }
  36%      { transform:translate(-3px,-3px) scale(.97); }
  48%      { transform:translate(4px,-8px) scale(1.05); }
  60%      { transform:translate(-1px,-2px) scale(.99); }
  72%      { transform:translate(2px,-4px) scale(1.02); }
  86%      { transform:translate(0,-1px) scale(1); }
}
@keyframes ball-shadow{
  0%, 100% { transform:translateX(-50%) scale(1);   opacity:.85; }
  12%      { transform:translateX(-50%) scale(.78); opacity:.5;  }
  24%      { transform:translateX(-50%) scale(.55); opacity:.32; }
  36%      { transform:translateX(-50%) scale(.95); opacity:.75; }
  48%      { transform:translateX(-50%) scale(.62); opacity:.4;  }
  60%      { transform:translateX(-50%) scale(.98); opacity:.8;  }
  72%      { transform:translateX(-50%) scale(.85); opacity:.6;  }
  86%      { transform:translateX(-50%) scale(1);   opacity:.85; }
}
.count-ball.pop{ animation:ball-pop .75s var(--ease) 1; }
@keyframes ball-pop{
  0%   { transform:scale(1)   translateY(0); }
  30%  { transform:scale(1.22) translateY(-12px); }
  55%  { transform:scale(.92) translateY(2px); }
  78%  { transform:scale(1.06) translateY(-3px); }
  100% { transform:scale(1)   translateY(0); }
}
.count-ball-scene.pop .count-ball-shadow{ animation:shadow-pop .75s var(--ease) 1; }
@keyframes shadow-pop{
  0%   { transform:translateX(-50%) scale(1);   opacity:.85; }
  30%  { transform:translateX(-50%) scale(.5);  opacity:.3;  }
  60%  { transform:translateX(-50%) scale(1.1); opacity:.9;  }
  100% { transform:translateX(-50%) scale(1);   opacity:.85; }
}

.add-row{display:flex; flex-direction:column; gap:8px; margin-bottom:10px; position:relative; z-index:1;}
.add-row-main{display:flex; gap:8px; align-items:stretch;}
.add-field{
  flex:1; min-width:0; display:flex; align-items:center;
  background:var(--card); border:1.5px solid transparent;
  border-radius:var(--radius-sm);
  transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
}
.add-field:focus-within{
  border-color:var(--accent); background:var(--card-hover);
  box-shadow:0 0 0 4px var(--focus-ring);
}
.add-input{
  flex:1; min-width:0; border:none; background:transparent;
  padding:13px 4px 13px 15px; font-family:inherit; font-size:.94rem;
  color:var(--ink); outline:none;
}
.add-input::placeholder{color:var(--ink-faint);}

.attach-btn{
  position:relative; flex-shrink:0; width:44px; height:44px; margin-right:3px;
  border:none; background:transparent; color:var(--ink-soft);
  border-radius:11px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:color .2s ease, background .2s ease, transform .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.attach-btn svg{width:20px; height:20px;}
.attach-btn:hover{color:var(--accent); background:var(--card-hover);}
.attach-btn:active{transform:scale(.92);}
.attach-btn.has-file{color:var(--accent);}
.attach-count{
  position:absolute; top:2px; right:2px; min-width:17px; height:17px; padding:0 4px;
  border-radius:999px; background:var(--accent); color:var(--on-accent);
  font-size:.62rem; font-weight:800; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.28); pointer-events:none;
}
.add-btn{
  flex-shrink:0; border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  color:var(--on-accent); font-weight:700; font-size:.9rem;
  padding:0 clamp(14px,4vw,22px); border-radius:var(--radius-sm);
  cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, filter .15s ease, opacity .2s ease;

  function escapeHtml(str){

  function formatBytes(bytes){
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

    return false;

  function withTimeout(promise, ms, label){
    return Promise.race([

  // ===== ATTACHMENT STORAGE (koleksi `attachments/{id}` + chunk di subcollection) =====

  async function saveAttachmentToFirestore(att){
    // att: { id, name, type, size, url? , data? }
    const ref = attsCol().doc(att.id);

    if (att.url) {
      await ref.set({
        name: att.name, type: att.type, size: att.size, url: att.url
      });
      return;
    }
    if (!att.data) return;

    const data = att.data;
    if (data.length <= ATT_DOC_LIMIT) {
      await ref.set({
        name: att.name, type: att.type, size: att.size, data: data
      });
      return;
    }

    // Chunk data besar
    const chunks = [];
    for (let i = 0; i < data.length; i += CHUNK_SIZE) {
      chunks.push(data.slice(i, i + CHUNK_SIZE));
    }
    await ref.set({
      name: att.name, type: att.type, size: att.size, chunkCount: chunks.length
    });

    // Tulis chunk dalam batch (max 400 per batch biar aman)
    for (let i = 0; i < chunks.length; i += 400) {
      const batch = db.batch();
      for (let j = i; j < Math.min(i + 400, chunks.length); j++) {
        const cid = String(j).padStart(6, '0');
        batch.set(ref.collection('chunks').doc(cid), { data: chunks[j] });
      }
      await batch.commit();
    }
  }

  async function loadAttachmentFromFirestore(attId){
    const ref = attsCol().doc(attId);
    const meta = await ref.get();
    if (!meta.exists) return null;
    const m = meta.data() || {};
    const att = { id: attId, name: m.name, type: m.type, size: m.size };

    if (m.url) { att.url = m.url; return att; }
    if (m.data) { att.data = m.data; return att; }

    if (m.chunkCount) {
      const snap = await ref.collection('chunks').get();
      const items = [];
      snap.forEach(c => items.push({ i: c.id, d: (c.data() || {}).data || '' }));
      items.sort((a,b) => a.i.localeCompare(b.i));
      att.data = items.map(x => x.d).join('');
      return att;
    }
    return att;
  }

  async function deleteAttachmentFromFirestore(attId){
    try {
      const ref = attsCol().doc(attId);
      const chunkSnap = await ref.collection('chunks').get();
      if (!chunkSnap.empty) {
        const batch = db.batch();
        chunkSnap.forEach(c => batch.delete(c.ref));
        batch.delete(ref);
        await batch.commit();
      } else {
        await ref.delete();
      }
    } catch (e){ console.warn('Delete attachment fail:', e); }
  }

  // Prefetch attachment data untuk semua task yang belum ke-cache
  function prefetchAtts(owner, tasks){
    for (const t of tasks){
      const list = t.attachments || [];
      for (const a of list){
        if (!a || !a.id) continue;
        if (attCache[owner][a.id]) continue;
        if (attLoading[owner][a.id]) continue;
        attLoading[owner][a.id] = true;
        loadAttachmentFromFirestore(a.id).then(full => {
          delete attLoading[owner][a.id];
          if (full) {
            attCache[owner][a.id] = full;
            scheduleRender(owner);
          }
        }).catch(err => {
          delete attLoading[owner][a.id];
          console.warn('Prefetch att fail:', err);

  // Render gabungan metadata task + data att (dari cache)
  function getRenderedAtts(owner, task){
    const list = task.attachments || [];
    return list.map(a => {
      const c = attCache[owner][a.id];
      if (c) return Object.assign({}, a, c);
      return Object.assign({}, a, { _notLoaded: true });
    });
  }

  const renderTimers = { paan: null, myla: null };
  function scheduleRender(owner){
    if (renderTimers[owner]) return;
    renderTimers[owner] = setTimeout(() => {
      renderTimers[owner] = null;
      render(owner);
    }, 60);
  }

  function render(owner){
    const list = state[owner] || [];
    const el = els[owner];
    if (!el) return;

    const remaining = list.filter(t => !t.done).length;
    const doneCount = list.filter(t => t.done).length;

    if (el.tabCount) el.tabCount.textContent = remaining;
    if (prevTabCounts[owner] !== null && prevTabCounts[owner] !== remaining) bumpTabSwitch();
    prevTabCounts[owner] = remaining;

    if (el.meta) {
      el.meta.textContent = list.length === 0
        ? 'Belum ada tugas'
        : list.length + ' tugas · ' + doneCount + ' selesai';
    }

    updateCatMood(owner, moodFor(list));
    updateBall(owner);

    const allDone = list.length > 0 && doneCount === list.length;
    if (el.clearBtn) el.clearBtn.disabled = !allDone;

    renderCourseMenu(owner);

    const filter = activeFilter[owner];
    let filteredList = list.filter(t => filter === 'active' ? !t.done : t.done);
    if (activeCourse[owner] !== 'all'){
      filteredList = filteredList.filter(t => (t.course || 'Lainnya') === activeCourse[owner]);
    }

    if (filteredList.length === 0){
      el.container.innerHTML =
        '<div class="empty-state">' + emptySVG +
        '<p>' + (filter === 'active'
          ? (activeCourse[owner] === 'all' ? 'Tidak ada tugas aktif. Santai dulu!' : 'Tidak ada tugas aktif di matkul ini.')
          : (activeCourse[owner] === 'all' ? 'Belum ada tugas yang selesai.' : 'Belum ada tugas selesai di matkul ini.')) +
        '</p></div>';
      return;
    }

    const grouped = {};
    filteredList.forEach(task => {
      const course = task.course || 'Lainnya';
      if (!grouped[course]) grouped[course] = [];
      grouped[course].push(task);
    });
    Object.keys(grouped).forEach(course => {
      grouped[course].sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    });

    function taskItemHTML(task, done){
      const atts = getRenderedAtts(owner, task);
      let attachHTML = '';
      if (atts.length){
        attachHTML = '<div class="attach-list">' + atts.map((att, i) => {
          const isImg = isImageType(att.type, att.name);
          const haveData = !!(att.url || att.data);
          const uploading = !!att._uploading;
          let cls = 'attach-chip';
          if (uploading) cls += ' uploading';

          let thumb;
          if (uploading) {
            thumb = '<span class="attach-icon">' + spinnerSVG + '</span>';
          } else if (isImg && haveData) {
            const src = att.url || att.data;
            thumb = '<img class="attach-thumb" src="' + escapeHtml(src) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">';
          } else if (isImg) {
            thumb = '<span class="attach-icon">' + imageSVG + '</span>';
          } else {
            thumb = '<span class="attach-icon">' + fileSVG + '</span>';
          }

          let titleText = att.name || 'Lampiran';
          if (uploading) titleText = 'Mengunggah… — ' + titleText;

          const nameLabel = escapeHtml(att.name || 'Lampiran');

          return '<button type="button" class="' + cls + '" ' +
                   (uploading ? 'disabled ' : '') +
                   'data-attach-id="' + escapeHtml(task.id) + '" ' +
                   'data-attach-index="' + i + '" ' +
                   'title="' + escapeHtml(titleText) + '">' +
                   thumb +
                   '<span class="attach-name">' + nameLabel + '</span>' +
                 '</button>';
        }).join('') + '</div>';
      }

      let timerHTML = '';
      if (task.deadline) {
        if (done) {
          timerHTML = '<span class="task-timer done-timer">Selesai</span>';
        } else {
          const diff = task.deadline - Date.now();
          if (diff > 0) {
            timerHTML = '<span class="task-timer on-time" data-deadline="' + task.deadline + '">Sisa: ' + formatTimeDiff(diff) + '</span>';
          } else {
            timerHTML = '<span class="task-timer late" data-deadline="' + task.deadline + '">Terlambat: ' + formatTimeDiff(diff) + '</span>';
          }
        }
      }

      return '' +
        '<li class="task-item' + (done ? ' done' : '') + '" data-id="' + escapeHtml(task.id) + '">' +
          '<button type="button" class="checkbox' + (done ? ' checked' : '') + '" ' +
                  'role="checkbox" aria-checked="' + (done ? 'true' : 'false') + '" ' +
                  'aria-label="' + (done ? 'Tandai belum selesai' : 'Tandai selesai') + '">' +
            checkSVG +
          '</button>' +
          '<div class="task-main">' +
            '<span class="task-text">' + escapeHtml(task.text) + '</span>' +
            timerHTML +
            attachHTML +
          '</div>' +
          '<button type="button" class="delete-btn" aria-label="Hapus tugas" title="Hapus tugas">' + trashSVG + '</button>' +
        '</li>';
    }

    let html = '';
    Object.keys(grouped).forEach(course => {
      html += '<div class="course-group">';
      html += '<h3 class="course-title">' + escapeHtml(course) + '</h3>';
      html += '<ul class="task-list">';
      grouped[course].forEach(t => { html += taskItemHTML(t, t.done); });
      html += '</ul></div>';
    });
    el.container.innerHTML = html;

    $$('.task-item', el.container).forEach(li => {
      const id = li.getAttribute('data-id');
      const cb = $('.checkbox', li);
      if (cb){
        cb.addEventListener('click', () => toggleTask(owner, id));
        cb.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleTask(owner, id); }
        });
      }
      const del = $('.delete-btn', li);
      if (del) del.addEventListener('click', () => removeTask(owner, id));

      $$('.attach-chip', li).forEach(chip => {
        if (chip.disabled) return;
        chip.addEventListener('click', () => {
          const idx = parseInt(chip.getAttribute('data-attach-index'), 10) || 0;
          openAttachment(owner, id, idx);
        });
      });
    });
  }

  async function openAttachment(owner, taskId, index){

  function sanitizeFilename(name){
    return String(name || 'file').replace(/[^\w.\-]+/g, '_').slice(0, 80);
  }

  async function uploadToStorage(owner, file){
    if (!storage) throw new Error('Firebase Storage tidak aktif');
    const path = 'attachments/' + owner + '/' + Date.now() + '_' +
                 Math.random().toString(36).slice(2,7) + '_' + sanitizeFilename(file.name);
    const ref = storage.ref(path);
    await withTimeout(ref.put(file), 45000, 'Upload');
    const url = await withTimeout(ref.getDownloadURL(), 15000, 'Ambil URL');
    return { url: url, storage: 'cloud' };
  }

  function compressImageToDataURL(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try { URL.revokeObjectURL(url); } catch (e){}
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (w > maxDim || h > maxDim){
          const s = maxDim / Math.max(w, h);
          w = Math.round(w * s);
          h = Math.round(h * s);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch (e){ reject(new Error('Kompresi gagal: ' + (e.message || e))); }
      };
      img.onerror = () => {
        try { URL.revokeObjectURL(url); } catch (e){}
        reject(new Error('Gagal memuat gambar'));
      };
      img.src = url;
    });
  }

  function fileToDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('Gagal membaca file'));
      reader.readAsDataURL(file);
    });
  }

  // PENTING: sekarang selalu mengembalikan att descriptor yang GUARANTEED punya data/url,
  // dan tidak pernah throw untuk file reasonable.
  async function buildAttachment(file){
    const id = newId('att_');
    const baseMeta = {
      id: id,
      name: file.name,
      type: file.type || 'application/octet-stream',
      size: file.size || 0
    };

    // 1) Coba Storage dulu (best case)
    if (storage) {
      try {
        const res = await uploadToStorage('shared', file);
        return Object.assign(baseMeta, { url: res.url, _kind: 'url' });
      } catch (err){
        console.warn('Storage gagal, fallback base64:', err && err.message);
      }
    }

    // 2) Fallback: base64 + chunk otomatis kalau perlu
    const isImg = isImageType(file.type, file.name);
    if (isImg) {
      const attempts = [
        { dim: 1000, q: 0.72 },
        { dim: 800, q: 0.65 },
        { dim: 650, q: 0.58 },
        { dim: 500, q: 0.5 },
        { dim: 380, q: 0.45 }
      ];
      let data = null;
      for (const a of attempts){
        try {
          const d = await compressImageToDataURL(file, a.dim, a.q);
          // Base64 length kira-kira = bytes. Simpan mentah aja, chunking yang atur.
          data = d;
          // Kalau sudah kecil (< 300KB base64), berhenti
          if (d.length < 300 * 1024) break;
        } catch (e){ /* coba attempt berikutnya */ }
      }
      if (!data) throw new Error('Gambar tidak bisa diproses');
      return Object.assign(baseMeta, { data: data, _kind: 'data' });
    }

    // Non-gambar: langsung base64, chunking akan pecah kalau besar
    const data = await fileToDataURL(file);
    return Object.assign(baseMeta, { data: data, _kind: 'data' });
  }

  function removePendingAt(owner, index){
    const list = pendingFiles[owner];
    const f = list[index];
    if (!f) return;
    if (f._previewUrl){ try { URL.revokeObjectURL(f._previewUrl); } catch (e) {} }
    list.splice(index, 1);
    renderPending(owner);
  }

  function clearPending(owner){
    pendingFiles[owner].forEach(f => {
      if (f && f._previewUrl){ try { URL.revokeObjectURL(f._previewUrl); } catch (e) {} }
    });
    pendingFiles[owner] = [];
    if (els[owner].fileInput) els[owner].fileInput.value = '';
    renderPending(owner);
  }

  function handleFilesSelected(owner, fileList){
    const files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;

    let added = 0;
    let skippedBig = 0;

    files.forEach(file => {
      if (pendingFiles[owner].length >= MAX_FILES){
        showToast('Maksimal ' + MAX_FILES + ' lampiran per tugas');
        return;
      }
      if (file.size > MAX_FILE_SIZE){
        skippedBig++;
        return;
      }
      const wrapped = {
        file: file,
        name: file.name,
        type: file.type || 'application/octet-stream',
        size: file.size || 0,
        _previewUrl: ''
      };
      if (isImageType(file.type, file.name)){
        try { wrapped._previewUrl = URL.createObjectURL(file); } catch (e) {}
      }
      pendingFiles[owner].push(wrapped);
      added++;
    });

    if (els[owner].fileInput) els[owner].fileInput.value = '';

    if (skippedBig > 0) showToast(skippedBig + ' file dilewati (maks 25 MB / file)');
    if (added > 0) renderPending(owner);
  }

      if (task && Array.isArray(task.attachments)){

  async function persistClearAll(owner){
    try {
      const snap = await tasksCol(owner).get();
      // Kumpulkan semua attachment IDs dulu untuk dihapus
      snap.forEach(doc => {
        const d = doc.data() || {};
        if (Array.isArray(d.attachments)){
          d.attachments.forEach(a => {
            if (a && a.id) deleteAttachmentFromFirestore(a.id);
          });
        }
      });
      const batch = db.batch();
      snap.forEach(doc => batch.delete(doc.ref));
      await batch.commit();

  // Migration dari struktur LAMA (attachments inline di task doc)
  async function migrateFromOldFormat(owner){
    try {
      const oldRef = db.collection('tasks').doc(owner);
      const oldDoc = await oldRef.get();
      if (!oldDoc.exists) return;
      const data = oldDoc.data() || {};
      if (!Array.isArray(data.items) || !data.items.length) return;

      const existing = await tasksCol(owner).limit(1).get();
      if (!existing.empty) return;

      const batch = db.batch();
      for (const task of data.items){
        if (!task || typeof task !== 'object') continue;
        if (!task.id) task.id = newId('t_');
        const attsMeta = [];
        if (Array.isArray(task.attachments)){
          for (const a of task.attachments){
            if (!a) continue;
            const attId = a.id || newId('att_');
            let url = a.url; let dataB64;
            if (url && url.startsWith('data:')) { dataB64 = url; url = null; }
            const attObj = { id: attId, name: a.name, type: a.type, size: a.size };
            if (url) attObj.url = url;
            else if (dataB64) attObj.data = dataB64;
            try { await saveAttachmentToFirestore(attObj); } catch(e){ console.warn('Migrate att fail', e); }
            attsMeta.push({ id: attId, name: a.name, type: a.type, size: a.size });
          }
        }
        batch.set(tasksCol(owner).doc(task.id), {
          text: task.text || '',
          done: !!task.done,
          course: task.course || 'Lainnya',
          deadline: task.deadline || null,
          createdAt: task.createdAt || Date.now(),
          attachments: attsMeta
        });
      }
      batch.update(oldRef, { items: [] });
      await batch.commit();
      console.log('Migrated ' + data.items.length + ' tasks for ' + owner);
    } catch (e){
      console.warn('Migration failed:', e);
    }
  }

  async function setupOwner(owner){
    loadFromLocalStorage(owner);
    await migrateFromOldFormat(owner);

    tasksCol(owner).onSnapshot((snap) => {
      const tasks = [];
      snap.forEach(doc => {
        const d = doc.data() || {};
        tasks.push({
          id: doc.id,
          text: d.text || '',
          done: !!d.done,
          course: d.course || 'Lainnya',
          deadline: d.deadline || null,
          createdAt: d.createdAt || Date.now(),
          attachments: Array.isArray(d.attachments) ? d.attachments : []
        });
      });
      tasks.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
      state[owner] = tasks;
      saveToLocalStorage(owner);
      prefetchAtts(owner, tasks);
      render(owner);
    }, (err) => {
      console.error('Firestore listen error:', err);
      if (els[owner].meta) els[owner].meta.textContent = 'Offline (Tersimpan Lokal)';
    });
  }

  async function addTask(owner, text){
    if (submitting[owner]) return;
    const trimmed = (text || '').trim();
    const queue = pendingFiles[owner].slice();
    const course = els[owner].course.value;
    const deadlineVal = els[owner].deadline.value;

    if (!trimmed && !queue.length){
      showToast('Tulis tugas dulu ya');
      els[owner].input.focus();
      return;
    }
    if (!course) {
      showToast('Pilih mata kuliah dulu ya');
      els[owner].course.focus();
      return;
    }

    submitting[owner] = true;
    const el = els[owner];
    const addBtn = $('.add-btn', el.form);
    const originalText = addBtn ? addBtn.textContent : 'Tambah';

    const taskId = newId('t_');

    // Placeholder chip untuk setiap file
    const placeholderAtts = queue.map(w => ({
      id: newId('att_'),
      name: w.name,
      type: w.type,
      size: w.size,
      _uploading: true
    }));

    const optimisticTask = {
      id: taskId,
      text: trimmed || (queue.length ? queue[0].name : '(tanpa judul)'),
      done: false,
      course: course,
      deadline: deadlineVal ? new Date(deadlineVal).getTime() : null,
      createdAt: Date.now(),
      attachments: placeholderAtts
    };
    state[owner].push(optimisticTask);
    clearPending(owner);
    render(owner);
    triggerCatJump(owner);

    el.input.value = '';
    el.course.value = '';
    el.deadline.value = '';
    el.input.focus();

    if (addBtn){ addBtn.disabled = true; addBtn.textContent = '…'; }

    // Proses semua file PARALEL
    let finalAtts = [];
    if (queue.length){
      const results = await Promise.all(queue.map(async (w, i) => {
        const placeholder = placeholderAtts[i];
        try {
          const att = await buildAttachment(w.file);
          // Pakai id dari placeholder supaya konsisten di UI
          att.id = placeholder.id;

          // Simpan attachment ke Firestore (collection terpisah — chunk otomatis kalau besar)
          await saveAttachmentToFirestore(att);

          // Prefetch ke cache supaya thumbnail langsung muncul
          attCache[owner][att.id] = {
            id: att.id, name: att.name, type: att.type, size: att.size,
            url: att.url, data: att.data
          };

          return att;
        } catch (err){
          console.error('Attachment gagal:', w.name, err);
          return {
            id: placeholder.id,
            name: w.name, type: w.type, size: w.size,
            _failed: true, _error: (err && err.message) || 'Upload gagal'
          };
        }
      }));
      finalAtts = results;
    }

    // Update task dengan attachments yang sudah diproses
    const idx = state[owner].findIndex(t => t.id === taskId);
    if (idx >= 0) {
      state[owner][idx].attachments = finalAtts.map(a => ({
        id: a.id, name: a.name, type: a.type, size: a.size, _failed: a._failed, _error: a._error
      }));
    }
    render(owner);

    // Simpan task doc (metadata atts)
    persistTaskAdd(owner, state[owner][idx]).then(() => {
      submitting[owner] = false;
      if (addBtn){ addBtn.disabled = false; addBtn.textContent = originalText; }
    });
  }

  function toggleTask(owner, id){
    const task = (state[owner] || []).find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    render(owner);
    if (task.done) triggerCatJump(owner);
    persistTaskToggle(owner, task);
  }

  function removeTask(owner, id){
    state[owner] = (state[owner] || []).filter(t => t.id !== id);
    render(owner);
    persistTaskDelete(owner, id);
  }

  function clearAllTasks(owner){
    const container = els[owner].container;
    const items = $$('.task-item', container);
    items.forEach(item => item.classList.add('clearing'));
    setTimeout(() => {
      state[owner] = [];
      activeCourse[owner] = 'all';
      render(owner);
      persistClearAll(owner);
    }, 380);
  }

  OWNERS.forEach(owner => {
    const el = els[owner];

    el.form.addEventListener('submit', (e) => {
      e.preventDefault();
      addTask(owner, el.input.value);
    });

    el.attachBtn.addEventListener('click', () => {
      el.fileInput.click();
    });

    el.fileInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (files && files.length) handleFilesSelected(owner, files);
    });

    el.clearBtn.addEventListener('click', () => clearAllTasks(owner));

    el.filterTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      const filter = btn.getAttribute('data-filter');
      if (activeFilter[owner] === filter) return;
      activeFilter[owner] = filter;
      activeCourse[owner] = 'all';
      $$('.filter-btn', el.filterTabs).forEach(b => b.classList.toggle('active', b === btn));
      render(owner);
    });
  });

  /* TAB SWITCH */
  const tabSwitch = document.getElementById('tabSwitch');
  const board = document.getElementById('board');
  const tabButtons = $$('.tab-btn', tabSwitch);
  const tabThumb = $('.tab-thumb', tabSwitch);
  let bumpTimer = null;

  function updateThumb(){
    const active = $('.tab-btn.active', tabSwitch);
    if (!active || !tabThumb) return;
    const cs = getComputedStyle(tabSwitch);
    const padL = parseFloat(cs.paddingLeft) || 5;
    const sw = tabSwitch.getBoundingClientRect();
    const r = active.getBoundingClientRect();
    tabThumb.style.width = r.width + 'px';
    tabThumb.style.transform = 'translateX(' + (r.left - sw.left - padL) + 'px)';
  }
  function bumpTabSwitch(){
    if (!tabSwitch) return;
    tabSwitch.classList.remove('bump');
    void tabSwitch.offsetWidth;
    tabSwitch.classList.add('bump');
    if (bumpTimer) clearTimeout(bumpTimer);
    bumpTimer = setTimeout(() => {
      tabSwitch.classList.remove('bump');
      updateThumb();
    }, 700);
  }
  function setActiveTab(tab){
    tabSwitch.setAttribute('data-active', tab);
    board.setAttribute('data-active', tab);
    tabButtons.forEach(btn => {
      const isActive = btn.getAttribute('data-tab') === tab;
      btn.classList.toggle('active', isActive);
    });
    applyMode(tab === 'paan' ? 'paanz' : 'myla');
    updateThumb();
  }
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => setActiveTab(btn.getAttribute('data-tab')));
  });
  window.addEventListener('resize', () => setTimeout(updateThumb, 60));
  window.addEventListener('load', () => setTimeout(updateThumb, 80));
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => setTimeout(updateThumb, 40));
  }
  setActiveTab('paan');
  setTimeout(updateThumb, 120);

  /* MOTIVATION */
  const motivationLines = [
    'Real-time sync otomatis antar perangkat via Firebase Firestore.',
    'Skripsi tidak akan selesai sendiri, tapi satu tugas selesai hari ini sudah kemajuan.',
    'Deadline terasa dekat, tapi langkah kecil hari ini yang membawamu sampai di sana.',
    'IPK tinggi dimulai dari to-do list yang dicoret satu per satu.',
    'Bukan soal secepat apa, tapi soal seberapa konsisten kamu mencentang tugas.',
    'Semester ini berat, tapi bukan berarti tidak bisa dilewati pelan-pelan.',
    'Revisi dosen memang menyebalkan, tapi setiap revisi mendekatkanmu ke sidang.',
    'Kerjakan yang bisa dikerjakan hari ini, sisanya urus besok dengan kepala lebih segar.',
    'Kuliah sambil begadang boleh sesekali, tapi jangan lupa istirahat juga bagian dari produktif.',
    'Satu tugas selesai lebih baik daripada sepuluh rencana yang tidak dimulai.'
  ];
  let motivationIndex = 0;
  const motivationEl = document.getElementById('motivationText');
  function rotateMotivation(){
    if (!motivationEl) return;
    motivationEl.classList.add('fading');
    setTimeout(() => {
      motivationIndex = (motivationIndex + 1) % motivationLines.length;
      motivationEl.textContent = motivationLines[motivationIndex];
      motivationEl.classList.remove('fading');
    }, 550);
  }
  setInterval(rotateMotivation, 5200);

  window.addEventListener('beforeunload', () => {
    OWNERS.forEach(owner => {
      pendingFiles[owner].forEach(f => {
        if (f && f._previewUrl){ try { URL.revokeObjectURL(f._previewUrl); } catch (e) {} }
      });
    });
  });

})();
</script>

</body>
</html>
